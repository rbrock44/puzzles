<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('puzzles-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <title>Puzzles</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="theme-color" content="#eef1f6" />
    <meta
      name="description"
      content="A tile-based collection of standalone browser puzzles, including Rack 'em Up (sort billiard balls into rows) and Top Spin (order numbers on a ring)."
    />
    <link rel="canonical" href="https://puzzles.ryan-brock.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Puzzles" />
    <meta
      property="og:description"
      content="A tile-based collection of standalone browser puzzles, including Rack 'em Up (sort billiard balls into rows) and Top Spin (order numbers on a ring)."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://puzzles.ryan-brock.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Puzzles" />
    <meta
      name="twitter:description"
      content="A tile-based collection of standalone browser puzzles, including Rack 'em Up (sort billiard balls into rows) and Top Spin (order numbers on a ring)."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Fraunces:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Lobster&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
