<app-back-button></app-back-button>

@if (component(); as component) {
  <ng-container *ngComponentOutlet="component" />
} @else if (loadFailed()) {
  <div class="puzzle-loading" role="alert">
    <p>This puzzle couldn't load. Check your connection and try again.</p>
    <button type="button" class="retry" (click)="retry()">Try again</button>
  </div>
} @else {
  <p class="puzzle-loading">Loading…</p>
}
