@if (!textLogoOnly) {
<div class="mini-board" [style.width.px]="this.boardWidth" [style.height.px]="this.boardHeight" role="img"
  aria-label="Top Spin board">
  <div class="mini-track" [style.top.px]="this.trackTop" [style.height.px]="this.trackHeight"></div>
  <div class="mini-turntable" [style.width.px]="this.turntableDiameter" [style.height.px]="this.turntableDiameter"
    [style.left.px]="this.turntableLeft" [style.top.px]="this.turntableTop">
    <span class="mini-turntable-face"><span class="mini-turntable-dot"></span></span>
    <span class="mini-turntable-grip"></span>
    <span class="mini-turntable-track"></span>
  </div>
  @for (token of tokens; track token.value) {
  <span class="mini-token" [class.in-turntable]="token.inTurntable" [style.width.px]="this.tokenDiameter"
    [style.height.px]="this.tokenDiameter" [style.left.px]="token.left" [style.top.px]="token.top"
    [style.font-size.px]="this.tokenDiameter * 0.48">{{ token.value }}</span>
  }
</div>
}
<span class="logo-title" aria-label="Top Spin">
  <span class="logo-group logo-group--top">
    <span class="logo-word">top.&nbsp;</span>
    <span class="logo-bar bottom-bar" aria-hidden="true"></span>
  </span>
  <span class="logo-s" aria-hidden="true">s</span>
  <span class="logo-group logo-group--pin">
    <span class="logo-bar top-bar" aria-hidden="true"></span>
    <span class="logo-word">&nbsp;pin</span>
  </span>
</span>
